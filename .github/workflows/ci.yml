name: CI (Typecheck, Test & Build)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend + server/functions/tests)
        run: npm run typecheck

      - name: Run unit & API tests
        run: npm test

      - name: Build production SPA & Cloud Run bundle
        run: npm run build
